apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: reproducible-build
  labels:
    app.kubernetes.io/part-of: reproducible-build-demo
spec:
  description: >-
    Clones a Git repository and builds a container image from a Dockerfile
    using upstream Tekton catalog tasks (git-clone + buildah).
    Reproducibility flags are passed via BUILD_EXTRA_ARGS. Tekton Chains
    picks up the type-hinted pipeline results to generate SLSA provenance.
  params:
    - name: git-url
      type: string
    - name: git-revision
      type: string
    - name: image
      type: string
    - name: build-extra-args
      type: string
      default: "--source-date-epoch 0 --rewrite-timestamp"
  results:
    - name: IMAGE_URL
      value: $(tasks.build.results.IMAGE_URL)
    - name: IMAGE_DIGEST
      value: $(tasks.build.results.IMAGE_DIGEST)
    - name: CHAINS-GIT_URL
      value: $(tasks.clone.results.url)
    - name: CHAINS-GIT_COMMIT
      value: $(tasks.clone.results.commit)
  workspaces:
    - name: shared-workspace
  tasks:
    - name: clone
      taskRef:
        name: git-clone
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.git-revision)
      workspaces:
        - name: output
          workspace: shared-workspace

    - name: build
      taskRef:
        name: buildah
      runAfter:
        - clone
      params:
        - name: IMAGE
          value: $(params.image)
        - name: DOCKERFILE
          value: ./Dockerfile
        - name: CONTEXT
          value: demo-app
        - name: TLSVERIFY
          value: "false"
        - name: STORAGE_DRIVER
          value: vfs
        - name: BUILD_EXTRA_ARGS
          value: $(params.build-extra-args)
      workspaces:
        - name: source
          workspace: shared-workspace
