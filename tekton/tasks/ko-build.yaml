apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ko-build
  labels:
    app.kubernetes.io/part-of: reproducible-build-demo
spec:
  description: >-
    Builds a Go application into a container image using ko with
    reproducibility guarantees. Emits IMAGE_URL and IMAGE_DIGEST results
    that Tekton Chains uses for SLSA provenance.
  params:
    - name: image
      type: string
      description: Target image repository (e.g. ttl.sh/reproducible-demo)
    - name: source-date-epoch
      type: string
      default: "0"
    - name: app-dir
      type: string
      description: Path to the Go module root, relative to workspace root.
      default: "src"
    - name: main-path
      type: string
      description: Path to package main, relative to app-dir (e.g. "./" or "./cmd/controller/")
      default: "./"
  results:
    - name: IMAGE_URL
      type: string
    - name: IMAGE_DIGEST
      type: string
  workspaces:
    - name: source
  steps:
    - name: build-and-push
      image: ghcr.io/ko-build/ko:latest
      env:
        - name: KO_DOCKER_REPO
          value: "$(params.image)"
        - name: SOURCE_DATE_EPOCH
          value: "$(params.source-date-epoch)"
        - name: KO_CONFIG_PATH
          value: "$(workspaces.source.path)/$(params.app-dir)/.ko.yaml"
      workingDir: "$(workspaces.source.path)/$(params.app-dir)"
      script: |
        #!/usr/bin/env sh
        set -eu

        echo "=== Reproducible Build ==="
        echo "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}"
        echo "KO_DOCKER_REPO=${KO_DOCKER_REPO}"
        echo "Building: $(params.main-path)"
        echo ""
        echo ".ko.yaml:"
        cat "${KO_CONFIG_PATH}"
        echo ""

        ko build "$(params.main-path)" --bare --sbom=none > /tmp/ko-out.txt 2>&1 || {
          cat /tmp/ko-out.txt
          exit 1
        }

        cat /tmp/ko-out.txt

        IMAGE_REF=$(grep '@sha256:' /tmp/ko-out.txt | tail -1 | tr -d '[:space:]')

        if [ -z "${IMAGE_REF}" ]; then
          echo "ERROR: could not find image reference in ko output"
          exit 1
        fi

        DIGEST="${IMAGE_REF##*@}"
        URL="${IMAGE_REF%%@*}"

        echo -n "${URL}"    > "$(results.IMAGE_URL.path)"
        echo -n "${DIGEST}" > "$(results.IMAGE_DIGEST.path)"

        echo ""
        echo "=== Build Complete ==="
        echo "IMAGE_URL:    ${URL}"
        echo "IMAGE_DIGEST: ${DIGEST}"
