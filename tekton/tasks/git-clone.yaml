apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-clone
  labels:
    app.kubernetes.io/part-of: reproducible-build-demo
spec:
  description: >-
    Clones a git repository at a specific commit SHA into a shared workspace.
    Emits CHAINS-GIT_URL and CHAINS-GIT_COMMIT results for Tekton Chains
    provenance.
  params:
    - name: url
      type: string
      description: Git repository URL
    - name: revision
      type: string
      description: Git revision to checkout (must be a full commit SHA for reproducibility)
  results:
    - name: CHAINS-GIT_URL
      type: string
      description: The exact URL that was cloned.
    - name: CHAINS-GIT_COMMIT
      type: string
      description: The exact commit SHA that was checked out.
  workspaces:
    - name: source
      description: Workspace to clone the repository into
  steps:
    - name: clone
      image: alpine/git:2.47.2
      script: |
        #!/usr/bin/env sh
        set -eu

        git clone "$(params.url)" "$(workspaces.source.path)/src"
        cd "$(workspaces.source.path)/src"
        git checkout "$(params.revision)"

        COMMIT=$(git rev-parse HEAD)
        echo -n "$(params.url)"  > "$(results.CHAINS-GIT_URL.path)"
        echo -n "${COMMIT}"      > "$(results.CHAINS-GIT_COMMIT.path)"

        echo "Cloned $(params.url) at ${COMMIT}"
