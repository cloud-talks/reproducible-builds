apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: buildah-build
  labels:
    app.kubernetes.io/part-of: reproducible-build-demo
spec:
  description: >-
    Builds a container image from a Dockerfile using buildah with optional
    reproducibility flags. Emits IMAGE_URL and IMAGE_DIGEST results that
    Tekton Chains uses for SLSA provenance.
  params:
    - name: image
      type: string
      description: Target image reference (e.g. ttl.sh/reproducible-demo)
    - name: dockerfile
      type: string
      default: "./Dockerfile"
    - name: app-dir
      type: string
      description: Path to the build context, relative to workspace root.
      default: "src/demo-app"
    - name: reproducible
      type: string
      description: '"true" to enable --source-date-epoch and --rewrite-timestamp'
      default: "true"
  results:
    - name: IMAGE_URL
      type: string
    - name: IMAGE_DIGEST
      type: string
  workspaces:
    - name: source
  volumes:
    - name: container-storage
      emptyDir: {}
  steps:
    - name: build-and-push
      image: quay.io/buildah/stable@sha256:ca4edbaabf71ca330ec9b2714bf8e06c726a6e85ae215cfb1474d2e2c832aacb
      securityContext:
        privileged: true
      volumeMounts:
        - name: container-storage
          mountPath: /var/lib/containers
      workingDir: "$(workspaces.source.path)/$(params.app-dir)"
      script: |
        #!/usr/bin/env bash
        set -eu

        REPRO_FLAGS=""
        if [ "$(params.reproducible)" = "true" ]; then
          REPRO_FLAGS="--source-date-epoch 0 --rewrite-timestamp"
        fi

        echo "=== Buildah Build ==="
        echo "Image:        $(params.image)"
        echo "Dockerfile:   $(params.dockerfile)"
        echo "Reproducible: $(params.reproducible)"
        if [ -n "${REPRO_FLAGS}" ]; then
          echo "Repro flags:  ${REPRO_FLAGS}"
        fi
        echo ""
        echo "Dockerfile:"
        cat "$(params.dockerfile)"
        echo ""

        buildah --storage-driver=vfs bud \
          ${REPRO_FLAGS} \
          --format=oci \
          --tls-verify=false \
          -f "$(params.dockerfile)" \
          -t "$(params.image)" \
          .

        buildah --storage-driver=vfs push \
          --tls-verify=false \
          --digestfile /tmp/image-digest \
          "$(params.image)" \
          "docker://$(params.image)"

        DIGEST=$(cat /tmp/image-digest)

        echo -n "$(params.image)" > "$(results.IMAGE_URL.path)"
        echo -n "${DIGEST}"       > "$(results.IMAGE_DIGEST.path)"

        echo ""
        echo "=== Build Complete ==="
        echo "IMAGE_URL:    $(params.image)"
        echo "IMAGE_DIGEST: ${DIGEST}"
