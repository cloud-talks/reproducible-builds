apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: reproducible-build-run-1-
  labels:
    app.kubernetes.io/part-of: reproducible-build-demo
    demo/run: "1"
spec:
  pipelineRef:
    name: reproducible-build
  params:
    - name: git-url
      value: "https://github.com/cloud-talks/reproducible-builds"
    - name: git-revision
      value: "584202d2866814fc726af1465ca317238774676a"
    - name: image
      value: "ttl.sh/reproducible-demo-oss-mumbai"
    - name: source-date-epoch
      value: "0"
    - name: main-path
      value: "./"
  workspaces:
    - name: shared-workspace
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 256Mi
