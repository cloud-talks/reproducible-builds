apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: naive-build-run-1-
  labels:
    app.kubernetes.io/part-of: reproducible-build-demo
    demo/run: "naive-1"
spec:
  pipelineRef:
    name: reproducible-build
  params:
    - name: git-url
      value: "https://github.com/cloud-talks/reproducible-builds"
    - name: git-revision
      value: "29859cf05450f211368294fda9b88acb21be5c67"
    - name: image
      value: "ttl.sh/reproducible-demo-naive"
    - name: build-extra-args
      value: ""
  workspaces:
    - name: shared-workspace
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
